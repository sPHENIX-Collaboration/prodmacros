### Standard full production 
sphnxprod03:
  defaultlocations:
    prodbase:   /sphenix/u/sphnxpro/Production2026/sphenixprod
    configbase: /sphenix/u/sphnxpro/Production2026/BRANCH/thisProd/rules
    submitdir:  /sphenix/data/data03/sphnxpro/production/run3pp/submission/{rule}

  # Event combining
  PROD_TRIGGERED_EVENT_run3pp:
    config: run3pp_calo_physics_PROD_TAG_VERSION.yaml
    runlist: /sphenix/u/sphnxpro/Production2026/BRANCH/thisProd/runlist
    # runs: [82374 82703]
    jobprio: 90
    submit: on
    dstspider: on

  # Waveform fitting
  PROD_CALOFITTING_run3pp:
    config: run3pp_calo_physics_PROD_TAG_VERSION.yaml
    runlist: /sphenix/u/sphnxpro/Production2026/BRANCH/thisProd/runlist
    jobprio: 60
    submit: on
    dstspider: on

  # Jet skimmer
  PROD_JETSKIMMER_run3pp:
    config: run3pp_calo_physics_PROD_TAG_VERSION.yaml
    runlist: /sphenix/u/sphnxpro/Production2026/BRANCH/thisProd/runlist
    jobprio: 30

