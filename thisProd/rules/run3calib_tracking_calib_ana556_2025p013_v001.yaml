#______________________________________________________________________________________________________________________
ana556_STREAMING_EVENT_run3calib:
  params:
    dsttype:     DST_STREAMING_EVENT
    period:      run3calib
    physicsmode: calib
    dataset:     run3calib
    build:       ana.556
    dbtag:       2025p013
    version:     1

  input:
    min_run_time:   300
    min_run_events: 100000
    combine_seg0_only: false

  job:
    script:                 run_parallel_streams.sh
    log:                   '{condor}/{logbase}.condor'
    neventsper:             10000
    payload:                [../streaming_code/*]
    request_memory:         1500MB, 2GB, 2500MB, 4GB, 6GB, 10GB
    request_xferslots:     '3'
    batch_name:            '{rule_name}_{outtriplet}'
    priority:              '90'

#______________________________________________________________________________________________________________________
ana556_TRKR_CLUSTER_run3calib:
  params:
    dsttype:     DST_TRKR_CLUSTER
    period:      run3calib
    physicsmode: calib
    dataset:     run3calib
    build:       ana.556
    dbtag:       2025p013
    version:     1

  input:
    intriplet:   ana556_2025p013_v001

  job:
    script:                 run_rolloverjob0.sh
    log:                   '{condor}/{logbase}.condor'
    neventsper:             1000
    payload:                [../tracking_code/*]
    request_memory:         8GB, 12GB, 16GB
    request_cpus:          '1'
    batch_name:            '{rule_name}_{outtriplet}'
    priority:              '60'

#______________________________________________________________________________________________________________________
ana556_TRKR_SEED_run3calib:
  params:
    dsttype:     DST_TRKR_SEED
    period:      run3calib
    physicsmode: calib
    dataset:     run3calib
    build:       ana.556
    dbtag:       2025p013
    version:     1

  input:
    intriplet:   ana556_2025p013_v001

  job:
    script:                 run_jobA.sh
    log:                   '{condor}/{logbase}.condor'
    neventsper:             1000
    payload:                [../tracking_code/*]
    request_memory:         3GB, 4GB, 6GB
    request_cpus:          '2'
    batch_name:            '{rule_name}_{outtriplet}'
    priority:              '30'

