ana571_COMBINED_run3pp:
  params:
    dsttype:     DST_COMBINED
    period:      run3pp
    physicsmode: physics
    dataset:     run3pp
    build:        ana.571
    dbtag:        2026p002
    version:      001

  input:
    intriplet:   ana561_2025p013_v001

  job:
    script:                 run_combining.sh
    log:                   '{condor}/{logbase}.condor'
    neventsper:             1000
    payload:                [../tracking_code/*]
    request_memory:         3GB, 5GB
    request_cpus:          '1'
    batch_name:            '{rule_name}_{outtriplet}'
    priority:              '80'

#______________________________________________________________________________________________________________________
ana571_TRKR_POLYSEED_COMBINED_run3pp:
  params:
    dsttype:     DST_TRKR_SEED
    period:      run3pp
    physicsmode: physics
    dataset:     run3pp
    build:        ana.571
    dbtag:        2026p002
    version:      002

  input:
    intriplet:   ana571_2026p002_v002
    inputmode:   combined4polyseed

  job:
    script:                 run_polyseed_combined.sh
    log:                   '{condor}/{logbase}.condor'
    neventsper:             1000
    payload:                [../tracking_code/*]
    request_memory:         5GB, 7GB, 12GB
    request_cpus:          '1'
    batch_name:            '{rule_name}_{outtriplet}'
    priority:              '30'

