#______________________________________________________________________________________________________________________
ana578_TRKR_POLYSEED_COMBINED_run3pp:
  params:
    dsttype:     DST_TRKR_SEED
    period:      run3pp
    physicsmode: physics
    dataset:     run3pp
    build:       ana.578
    dbtag:       2026p004
    version:     1

  input:
    intriplet:   ana571_2026p002_v001
    inputmode:   combined4polyseed

  job:
    script:                 run_polyseed_combined.sh
    log:                   '{condor}/{logbase}.condor'
    neventsper:             1000
    payload:                [../tracking_code/*]
    request_memory:         5GB, 7GB, 12GB
    request_cpus:          '1'
    batch_name:            '{rule_name}_{outtriplet}'
    priority:              '30'


