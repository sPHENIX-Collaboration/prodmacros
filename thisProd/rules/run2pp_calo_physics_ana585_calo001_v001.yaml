# run2pp calo, downstream steps only (no event combining).
# Replace PROD, TAG, and VERSION for the instance. TAG is the QA/skimmer conditions tag.
# CALOFITTING reads the existing pro001_pcdb001_v001 DST_TRIGGERED_EVENT files and writes
# ana585_pcdb004_v001; its optional QA histograms use qadbtag TAG.
# JETSKIMMER reads ana585_pcdb004_v001 and writes PROD_TAG_VERSION.
#______________________________________________________________________________
ana585_CALOFITTING_run2pp:
  params:
    dsttype:      DST_CALOFITTING
    build:        ana.585
    dbtag:        pcdb004
    qadbtag:      calo001
    version:      1
    period:       run2pp
    dataset:      run2pp
    physicsmode:  physics

  input:
    table:        datasets
    intriplet:    pro001_pcdb001_v001  # Existing run2pp DST_TRIGGERED_EVENT files

  job:
    script:                 run_fitting.sh
    log:                   '{condor}/{logbase}.condor'
    neventsper:             100000
    payload:                [../calo_code/*]
    request_memory:         2500MB, 3.9GB, 6GB
    request_cpus:          '1'
    batch_name:            '{rule_name}_{outtriplet}'
    priority:              '60'
    rungroup_size:         1
    filesystem:
      logdir:   "/sphenix/data/data03/sphnxpro/{prodmode}/{period}/{physicsmode}/{outtriplet}/{leafdir}/{rungroup}/log"
      histdir:  "/sphenix/data/data03/sphnxpro/{prodmode}/{period}/{physicsmode}/{outtriplet}/{leafdir}/{rungroup}/hist"
      condor:            "/tmp/data03/sphnxpro/{prodmode}/{period}/{physicsmode}/{outtriplet}/{leafdir}/{rungroup}/log"

#______________________________________________________________________________
ana585_JETSKIMMER_run2pp:
  params:
    dsttype:     DST_JETCALO
    build:       ana.585
    dbtag:       newcdbtag
    version:     1
    period:      run2pp
    dataset:     run2pp
    physicsmode: physics

  input:
    table:       datasets
    intriplet:   ana585_pcdb004_v001  # Output triplet of PROD_CALOFITTING_run2pp
    indsttype:   DST_CALOFITTING

  job:
    script:                 run_jetskimmer.sh
    log:                   '{condor}/{logbase}.condor'
    neventsper:             100000
    payload:                [../calo_code/*]
    request_memory:         2500MB, 3.9GB, 6GB
    request_cpus:          '1'
    batch_name:            '{rule_name}_{outtriplet}'
    priority:              '60'
    rungroup_size:         1
    filesystem:
      logdir:   "/sphenix/data/data03/sphnxpro/{prodmode}/{period}/{physicsmode}/{outtriplet}/{leafdir}/{rungroup}/log"
      histdir:  "/sphenix/data/data03/sphnxpro/{prodmode}/{period}/{physicsmode}/{outtriplet}/{leafdir}/{rungroup}/hist"
      condor:            "/tmp/data03/sphnxpro/{prodmode}/{period}/{physicsmode}/{outtriplet}/{leafdir}/{rungroup}/log"

###############################################################################
