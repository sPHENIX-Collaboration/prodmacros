#______________________________________________________________________________________________________________________
PROD_STREAMING_EVENT_run2pp:
  params:
    dsttype:     DST_STREAMING_EVENT
    period:      run2pp
    physicsmode: physics
    dataset:     run2pp
    build:       PROD
    dbtag:       TAG
    version:     VERSION

  input:
    min_run_time:   300
    min_run_events: 100000
    combine_seg0_only: false

  job:
    script:                 run_parallel_streams.sh
    log:                   '{condor}/{logbase}.condor'
    neventsper:             10000
    payload:                [../streaming_code/*]
    request_memory:         2.5GB, 3.9GB, 8GB, 25GB
    request_xferslots:     '3'
    batch_name:            '{rule_name}_{outtriplet}'
    priority:              '90'

#______________________________________________________________________________________________________________________
PROD_TRKR_CLUSTER_run2pp:
  params:
    dsttype:     DST_TRKR_CLUSTER
    period:      run2pp
    physicsmode: physics
    dataset:     run2pp
    build:       PROD
    dbtag:       TAG
    version:     VERSION

  input:
    intriplet:   PROD_TAG_VERSION

  job:
    script:                 run_rolloverjob0.sh
    log:                   '{condor}/{logbase}.condor'
    neventsper:             1000
    payload:                [../tracking_code/*]
    request_memory:         8GB, 12GB
    request_cpus:          '1'
    batch_name:            '{rule_name}_{outtriplet}'
    priority:              '60'

#______________________________________________________________________________________________________________________
PROD_TRKR_SEED_run2pp:
  params:
    dsttype:     DST_TRKR_SEED
    period:      run2pp
    physicsmode: physics
    dataset:     run2pp
    build:       PROD
    dbtag:       TAG
    version:     VERSION

  input:
    intriplet:   PROD_TAG_VERSION

  job:
    script:                 run_jobA.sh
    log:                   '{condor}/{logbase}.condor'
    neventsper:             1000
    payload:                [../tracking_code/*]
    request_memory:         2.5GB, 4GB
    request_cpus:          '2'
    batch_name:            '{rule_name}_{outtriplet}'
    priority:              '30'

###############################################################################
