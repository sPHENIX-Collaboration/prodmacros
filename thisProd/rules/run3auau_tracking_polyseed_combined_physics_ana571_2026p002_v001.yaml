PROD_COMBINED_run3auau:
  params:
    dsttype:     DST_COMBINED
    period:      run3auau
    physicsmode: physics
    dataset:     run3auau
    build:        ana.571
    dbtag:        2026p002
    version:      001

  input:
    intriplet:   ana561_2025p013_v001

  job:
    script:                 run_combining.sh
    log:                   '{condor}/{logbase}.condor'
    neventsper:             1000
    payload:                [../tracking_code/*]
    request_memory:         3GB, 5GB
    request_cpus:          '1'
    batch_name:            '{rule_name}_{outtriplet}'
    priority:              '80'

