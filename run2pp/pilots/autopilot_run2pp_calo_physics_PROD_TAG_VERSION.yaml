################################# Prod02 #######################################
### run2pp calo: downstream steps only (fitting, jet skimmer); no event combining
sphnxprod02:
  defaultlocations:
    prodbase:   /sphenix/u/sphnxpro/Production2026/sphenixprod
    configbase: /sphenix/u/sphnxpro/Production2026/BRANCH/thisProd/rules
    submitdir:  /sphenix/data/data03/sphnxpro/production/run2pp/submission/{batch_name}

  # Waveform fitting (input: existing pro001_pcdb001_v001 DST_TRIGGERED_EVENT)
  PROD_CALOFITTING_run2pp:
    config: run2pp_calo_physics_PROD_TAG_VERSION.yaml
    runlist: /sphenix/u/sphnxpro/Production2026/BRANCH/thisProd/runlist
    jobprio: 60
    submit: on
    dstspider: on
    histspider: on

  # Jet skimmer (input: DST_CALOFITTING of this production)
  PROD_JETSKIMMER_run2pp:
    config: run2pp_calo_physics_PROD_TAG_VERSION.yaml
    runlist: /sphenix/u/sphnxpro/Production2026/BRANCH/thisProd/runlist
    jobprio: 30
    submit: on
    dstspider: on
    histspider: on

