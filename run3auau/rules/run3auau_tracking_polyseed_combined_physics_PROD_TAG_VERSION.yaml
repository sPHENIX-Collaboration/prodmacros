PROD_COMBINED_run3auau:
  params:
    dsttype:     DST_COMBINED
    period:      run3auau
    physicsmode: physics
    dataset:     run3auau
    build:       PROD
    dbtag:       TAG
    version:     VERSION

  input:
    intriplet:   PROD_TAG_VERSION

  job:
    script:                 run_combining.sh
    log:                   '{condor}/{logbase}.condor'
    neventsper:             1000
    payload:                [../tracking_code/*]
    request_memory:         3GB, 5GB
    request_cpus:          '1'
    batch_name:            '{rule_name}_{outtriplet}'
    priority:              '80'

#______________________________________________________________________________________________________________________
PROD_TRKR_POLYSEED_COMBINED_run3auau:
  params:
    dsttype:     DST_TRKR_SEED
    period:      run3auau
    physicsmode: physics
    dataset:     run3auau
    build:       PROD
    dbtag:       TAG
    version:     VERSION

  input:
    intriplet:   PROD_TAG_VERSION
    inputmode:   combined4polyseed

  job:
    script:                 run_polyseed_combined.sh
    log:                   '{condor}/{logbase}.condor'
    neventsper:             1000
    payload:                [../tracking_code/*]
    request_memory:         6GB, 8GB, 13GB
    request_cpus:          '1'
    batch_name:            '{rule_name}_{outtriplet}'
    priority:              '30'

