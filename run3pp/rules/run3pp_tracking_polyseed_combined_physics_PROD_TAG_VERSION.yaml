PROD_TRKR_POLYSEED_COMBINED_run3pp:
  params:
    dsttype:     DST_TRKR_SEED
    period:      run3pp
    physicsmode: physics
    dataset:     run3pp
    build:       PROD
    dbtag:       TAG
    version:     VERSION

  input:
    intriplet:   PROD_TAG_VERSION
    inputmode:   combined4polyseed

  job:
    script:                 run_polyseed_combined.sh
    log:                   '{condor}/{logbase}.condor'
    neventsper:             1000
    payload:                [../tracking_code/*]
    request_memory:         9GB, 12GB
    request_cpus:          '1'
    batch_name:            '{rule_name}_{outtriplet}'
    priority:              '30'

